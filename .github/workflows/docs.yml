# Builds the docs in docs/ with Zensical and publishes them to GitHub Pages
# (https://teapoweredsolutions.github.io/Steep-Public/) on every push to main.
# The docs and zensical.toml are generated from Steep's sources by build/docs/Build-DocsSite.ps1 -SourceOnly.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Zensical
        run: pip install zensical==0.1.3
      - name: Build the site
        run: zensical build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
